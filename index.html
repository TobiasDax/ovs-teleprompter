<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleprompter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #202124; color: #e8eaed; font-family: sans-serif; min-height: 100vh; }

    /* Upload screen */
    #upload-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1.5rem;
    }
    #upload-screen h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.1em; }
    #drop-zone {
      border: 2px dashed #555;
      border-radius: 12px;
      padding: 3rem 4rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      width: 400px;
      max-width: 90vw;
    }
    #drop-zone.drag-over { border-color: #e8eaed; background: #2a2c2f; }
    #drop-zone p { margin-bottom: 1rem; color: #aaa; }
    #file-input { display: none; }
    #choose-label {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      background: #e8eaed;
      color: #202124;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    #choose-label:hover { background: #fff; }
    #error-msg {
      color: #ff6b6b;
      font-size: 0.9rem;
      min-height: 1.2em;
      text-align: center;
    }

    /* Teleprompter screen (hidden initially) */
    #teleprompter-screen { display: none; }
  </style>
</head>
<body>

  <div id="upload-screen">
    <h1>Teleprompter</h1>
    <div id="drop-zone">
      <p>Skript hierher ziehen</p>
      <input type="file" id="file-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      <label id="choose-label" for="file-input">Datei auswählen</label>
    </div>
    <div id="error-msg" role="alert" aria-live="polite"></div>
  </div>

  <div id="teleprompter-screen">
    <!-- filled by JS -->
  </div>

  <script src="mammoth.min.js"></script>
  <script src="purify.min.js"></script>
  <script>
    const fileInput = document.getElementById('file-input');
    const dropZone  = document.getElementById('drop-zone');
    const errorMsg  = document.getElementById('error-msg');

    function showError(msg) {
      errorMsg.textContent = msg;
    }

    /**
     * Parses mammoth.js HTML into structured teleprompter data.
     * Returns { rows: Array }
     *   Section row:  { type: 'section', html: string }
     *   Content row:  { type: 'content', sceneNumber: string, bildebene: string,
     *                   tonebene: string, bemerkung: string }
     * Throws Error if structure is unexpected.
     */
    function parseDocxHtml(html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var table = doc.querySelector('table');
      if (!table) { throw new Error('Kein Table im Dokument gefunden.'); }

      var allRows = Array.from(table.querySelectorAll('tr'));
      if (allRows.length < 2) { throw new Error('Tabelle hat zu wenig Zeilen.'); }

      // Validate header row
      var headerCells = Array.from(allRows[0].querySelectorAll('td, th'));
      var headerTexts = headerCells.map(function(c) { return c.textContent.trim().toLowerCase(); });
      var hasExpectedHeaders = (
        headerTexts.some(function(t) { return t === '#'; }) &&
        headerTexts.some(function(t) { return t.includes('bildebene'); }) &&
        headerTexts.some(function(t) { return t.includes('tonebene'); })
      );
      if (!hasExpectedHeaders) {
        throw new Error(
          'Unerwartetes Tabellenformat. Erwartet: # | Bildebene | Tonebene | Bemerkung. ' +
          'Gefunden: ' + headerTexts.join(' | ')
        );
      }

      var rows = [];
      for (var i = 1; i < allRows.length; i++) {
        var cells = Array.from(allRows[i].querySelectorAll('td, th'));
        if (cells.length === 0) { continue; }

        var firstCell = cells[0];
        var colspan = parseInt(firstCell.getAttribute('colspan') || '1', 10);

        // Section header: cell spans 3+ columns or row has only 1 cell
        if (colspan >= 3 || cells.length === 1) {
          rows.push({ type: 'section', html: firstCell.innerHTML });
          continue;
        }

        // Content row: 4 cells
        if (cells.length >= 4) {
          rows.push({
            type: 'content',
            sceneNumber: cells[0].innerHTML,
            bildebene:   cells[1].innerHTML,
            tonebene:    cells[2].innerHTML,
            bemerkung:   cells[3].innerHTML
          });
        }
      }

      if (rows.length === 0) { throw new Error('Keine Tabellenzeilen gefunden.'); }
      return { rows: rows };
    }

    function readDocx(file) {
      if (!file || !file.name.toLowerCase().endsWith('.docx')) {
        showError('Bitte eine .docx-Datei auswählen.');
        return;
      }
      showError('');
      const reader = new FileReader();
      reader.onload = function(e) {
        mammoth.convertToHtml({ arrayBuffer: e.target.result })
          .then(function(result) {
            console.log('=== mammoth HTML output (first 2000 chars) ===');
            console.log(result.value.substring(0, 2000));
            var data = parseDocxHtml(result.value);
            console.log('Parsed rows:', data.rows.length);
            console.log('First section row:', data.rows.find(function(r) { return r.type === 'section'; }));
            console.log('First content row:', data.rows.find(function(r) { return r.type === 'content'; }));
            // TODO: render
          })
          .catch(function(err) {
            showError('Datei konnte nicht gelesen werden. Bitte eine gültige .docx-Datei auswählen.');
            console.error('mammoth error:', err);
          });
      };
      reader.onerror = function() {
        showError('Fehler beim Lesen der Datei.');
      };
      reader.readAsArrayBuffer(file);
    }

    fileInput.addEventListener('change', function(e) {
      readDocx(e.target.files[0]);
      fileInput.value = '';
    });

    dropZone.addEventListener('dragover', function(e) {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', function(e) {
      if (!dropZone.contains(e.relatedTarget)) {
        dropZone.classList.remove('drag-over');
      }
    });
    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      readDocx(e.dataTransfer.files[0]);
    });

    dropZone.addEventListener('click', function(e) {
      if (e.target !== document.getElementById('choose-label') && e.target !== fileInput) {
        fileInput.click();
      }
    });
  </script>
</body>
</html>
