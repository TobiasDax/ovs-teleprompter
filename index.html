<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleprompter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #202124; color: #e8eaed; font-family: sans-serif; min-height: 100vh; }

    /* Upload screen */
    #upload-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1.5rem;
    }
    #upload-screen h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.1em; }
    #drop-zone {
      border: 2px dashed #555;
      border-radius: 12px;
      padding: 3rem 4rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      width: 400px;
      max-width: 90vw;
    }
    #drop-zone.drag-over { border-color: #e8eaed; background: #2a2c2f; }
    #drop-zone p { margin-bottom: 1rem; color: #aaa; }
    #file-input { display: none; }
    #choose-label {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      background: #e8eaed;
      color: #202124;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    #choose-label:hover { background: #fff; }
    #error-msg {
      color: #ff6b6b;
      font-size: 0.9rem;
      min-height: 1.2em;
      text-align: center;
    }

    /* Teleprompter screen (hidden initially) */
    #teleprompter-screen { display: none; padding: 2rem 1rem 6rem; }

    /* Teleprompter table layout */
    #table-container { max-width: 90vw; margin: 0 auto; }

    table.teleprompter { width: 100%; border-collapse: collapse; }
    table.teleprompter td, table.teleprompter th {
      border: none;
      border-bottom: 1px solid #333;
      padding: 0.5rem 0.75rem;
      vertical-align: top;
    }

    /* Scene number column */
    table.teleprompter td.col-num {
      opacity: 0.7;
      font-size: 1rem;
      white-space: nowrap;
      width: 4rem;
    }

    /* Hidden columns */
    table.teleprompter td.col-bildebene,
    table.teleprompter th.col-bildebene,
    table.teleprompter td.col-bemerkung,
    table.teleprompter th.col-bemerkung { display: none; }

    /* Show hidden columns when toggle is active */
    table.teleprompter.columns-visible td.col-bildebene,
    table.teleprompter.columns-visible th.col-bildebene,
    table.teleprompter.columns-visible td.col-bemerkung,
    table.teleprompter.columns-visible th.col-bemerkung { display: table-cell; }

    /* Section header rows: always visible */
    table.teleprompter tr.section-row td {
      display: table-cell !important;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 1.25rem 0.75rem 0.5rem;
      color: #aaa;
      background: #272a2d;
    }

    /* Text formatting */
    table.teleprompter strong { color: greenyellow; }
    table.teleprompter em { color: #ff6900; }

    /* Teleprompter paragraph spacing */
    table.teleprompter td p { display: block; margin-bottom: 10rem; }
    table.teleprompter td p:last-child { margin-bottom: 0; }

    /* Images */
    table.teleprompter td img { max-width: 100%; height: auto; display: block; margin: 0.5rem 0; }

    /* Toggle button */
    #toggle-btn {
      position: fixed;
      top: 20%;
      left: 2rem;
      background: transparent;
      color: red;
      border: none;
      font-size: 3rem;
      cursor: pointer;
      padding: 5px;
      border-radius: 5px 20px;
      line-height: 1;
      transition: transform 0.25s;
      z-index: 100;
    }
    #toggle-btn.active { transform: rotate(180deg); }

    /* Back button */
    #back-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: transparent;
      color: #888;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-size: 0.85rem;
      z-index: 100;
    }
    #back-btn:hover { color: #e8eaed; border-color: #e8eaed; }
  </style>
</head>
<body>

  <div id="upload-screen">
    <h1>Teleprompter</h1>
    <div id="drop-zone">
      <p>Skript hierher ziehen</p>
      <input type="file" id="file-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      <label id="choose-label" for="file-input">Datei auswählen</label>
    </div>
    <div id="error-msg" role="alert" aria-live="polite"></div>
  </div>

  <div id="teleprompter-screen">
    <button id="toggle-btn" aria-label="Bildebene und Bemerkung einblenden">&#10148;</button>
    <button id="back-btn" aria-label="Neues Skript laden">&#8592; Neues Skript</button>
    <div id="table-container"></div>
  </div>

  <script src="mammoth.min.js"></script>
  <script src="purify.min.js"></script>
  <script>
    const fileInput = document.getElementById('file-input');
    const dropZone  = document.getElementById('drop-zone');
    const errorMsg  = document.getElementById('error-msg');

    function showError(msg) {
      errorMsg.textContent = msg;
    }

    /**
     * Parses mammoth.js HTML into structured teleprompter data.
     * Returns { rows: Array }
     *   Section row:  { type: 'section', html: string }
     *   Content row:  { type: 'content', sceneNumber: string, bildebene: string,
     *                   tonebene: string, bemerkung: string }
     * Throws Error if structure is unexpected.
     */
    function parseDocxHtml(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const table = doc.querySelector('table');
      if (!table) { throw new Error('Kein Table im Dokument gefunden.'); }

      const allRows = Array.from(table.rows);
      if (allRows.length < 2) { throw new Error('Tabelle hat zu wenig Zeilen.'); }

      // Validate header row
      const headerCells = Array.from(allRows[0].querySelectorAll('td, th'));
      const headerTexts = headerCells.map(function(c) { return c.textContent.trim().toLowerCase(); });
      const hasExpectedHeaders = (
        headerTexts.some(function(t) { return t.includes('#'); }) &&
        headerTexts.some(function(t) { return t.includes('bildebene'); }) &&
        headerTexts.some(function(t) { return t.includes('tonebene'); })
      );
      if (!hasExpectedHeaders) {
        throw new Error(
          'Unerwartetes Tabellenformat. Erwartet: # | Bildebene | Tonebene | Bemerkung. ' +
          'Gefunden: ' + headerTexts.join(' | ')
        );
      }

      const rows = [];
      for (let i = 1; i < allRows.length; i++) {
        const cells = Array.from(allRows[i].querySelectorAll('td, th'));
        if (cells.length === 0) { continue; }

        const firstCell = cells[0];
        const colspan = parseInt(firstCell.getAttribute('colspan') || '1', 10);

        // Section header: cell spans 3+ columns or row has only 1 cell
        if (colspan >= 3 || cells.length === 1) {
          rows.push({ type: 'section', html: firstCell.innerHTML });
          continue;
        }

        // Content row: 4 cells
        if (cells.length >= 4) {
          rows.push({
            type: 'content',
            sceneNumber: cells[0].innerHTML,
            bildebene:   cells[1].innerHTML,
            tonebene:    cells[2].innerHTML,
            bemerkung:   cells[3].innerHTML
          });
        } else {
          console.warn('parseDocxHtml: skipping row with unexpected cell count:', cells.length, 'at row index', i);
        }
      }

      if (rows.length === 0) { throw new Error('Keine Tabellenzeilen gefunden.'); }
      return { rows: rows };
    }

    /**
     * Builds sanitized HTML for the teleprompter table.
     * All cell content from mammoth is sanitized with DOMPurify before DOM insertion.
     */
    function renderTeleprompter(data) {
      const tbodyRows = data.rows.map(function(row) {
        if (row.type === 'section') {
          const sectionHtml = DOMPurify.sanitize(row.html);
          const tr = document.createElement('tr');
          tr.className = 'section-row';
          const td = document.createElement('td');
          td.setAttribute('colspan', '4');
          td.innerHTML = sectionHtml;
          tr.appendChild(td);
          return tr.outerHTML;
        }
        const numHtml  = DOMPurify.sanitize(row.sceneNumber);
        const bildHtml = DOMPurify.sanitize(row.bildebene);
        const tonHtml  = DOMPurify.sanitize(row.tonebene);
        const bemHtml  = DOMPurify.sanitize(row.bemerkung);
        return (
          '<tr>' +
            '<td class="col-num">'       + numHtml  + '</td>' +
            '<td class="col-bildebene">' + bildHtml + '</td>' +
            '<td class="col-tonebene">'  + tonHtml  + '</td>' +
            '<td class="col-bemerkung">' + bemHtml  + '</td>' +
          '</tr>'
        );
      }).join('');

      return (
        '<table class="teleprompter">' +
          '<thead><tr>' +
            '<th class="col-num">#</th>' +
            '<th class="col-bildebene">Bildebene</th>' +
            '<th class="col-tonebene">Tonebene</th>' +
            '<th class="col-bemerkung">Bemerkung</th>' +
          '</tr></thead>' +
          '<tbody>' + tbodyRows + '</tbody>' +
        '</table>'
      );
    }

    function readDocx(file) {
      if (!file || !file.name.toLowerCase().endsWith('.docx')) {
        showError('Bitte eine .docx-Datei auswählen.');
        return;
      }
      showError('');
      const reader = new FileReader();
      reader.onload = function(e) {
        mammoth.convertToHtml({ arrayBuffer: e.target.result })
          .then(function(result) {
            var data;
            try {
              data = parseDocxHtml(result.value);
            } catch (parseErr) {
              showError(parseErr.message);
              console.error('parse error:', parseErr);
              return;
            }
            const tableHtml = renderTeleprompter(data);
            const container = document.getElementById('table-container');
            container.innerHTML = DOMPurify.sanitize(tableHtml);
            document.getElementById('upload-screen').style.display = 'none';
            document.getElementById('teleprompter-screen').style.display = 'block';
          })
          .catch(function(err) {
            showError('Datei konnte nicht gelesen werden. Bitte eine gültige .docx-Datei auswählen.');
            console.error('mammoth error:', err);
          });
      };
      reader.onerror = function() {
        showError('Fehler beim Lesen der Datei.');
      };
      reader.readAsArrayBuffer(file);
    }

    fileInput.addEventListener('change', function(e) {
      readDocx(e.target.files[0]);
      fileInput.value = '';
    });

    dropZone.addEventListener('dragover', function(e) {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', function(e) {
      if (!dropZone.contains(e.relatedTarget)) {
        dropZone.classList.remove('drag-over');
      }
    });
    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      readDocx(e.dataTransfer.files[0]);
    });

    dropZone.addEventListener('click', function(e) {
      if (e.target !== document.getElementById('choose-label') && e.target !== fileInput) {
        fileInput.click();
      }
    });

    document.getElementById('toggle-btn').addEventListener('click', function() {
      const table = document.querySelector('table.teleprompter');
      const btn   = document.getElementById('toggle-btn');
      if (!table) { return; }
      table.classList.toggle('columns-visible');
      btn.classList.toggle('active');
    });

    document.getElementById('back-btn').addEventListener('click', function() {
      document.getElementById('teleprompter-screen').style.display = 'none';
      document.getElementById('table-container').innerHTML = '';
      document.getElementById('upload-screen').style.display = 'flex';
      document.getElementById('error-msg').textContent = '';
      document.getElementById('file-input').value = '';
      document.getElementById('toggle-btn').classList.remove('active');
    });
  </script>
</body>
</html>
