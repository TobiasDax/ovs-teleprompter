name: Release binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    # Reuses the existing "daxlite-ci" runner (label: ubuntu-latest) also
    # used by other repos on this Forgejo instance.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Go
        uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cross-compile binaries
        run: |
          mkdir dist
          build() {
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build -o "dist/teleprompter-$1-$2$3" .
          }
          build linux amd64 ""
          build windows amd64 ".exe"
          build darwin amd64 ""
          build darwin arm64 ""

      # Requires a Forgejo Actions secret RELEASE_TOKEN: a personal access
      # token (Settings -> Applications) with "write:repository" scope,
      # used to create the release and upload assets via the Forgejo API.
      - name: Create release and upload binaries
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apt-get update && apt-get install -y --no-install-recommends jq

          api="$SERVER_URL/api/v1/repos/$REPO"

          # request <method> <url> [curl-args...] — prints the body on success,
          # fails loudly (instead of silently) on any non-2xx response.
          request() {
            method="$1"; url="$2"; shift 2
            resp=$(curl -sS -w '\n%{http_code}' -X "$method" \
              -H "Authorization: token $RELEASE_TOKEN" "$@" "$url")
            status=$(echo "$resp" | tail -1)
            body=$(echo "$resp" | sed '$d')
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "$method $url failed (HTTP $status): $body" >&2
              return 1
            fi
            echo "$body"
          }

          # Create the release, or reuse it if a previous run already made it
          # for this tag (e.g. a retry after an earlier asset-upload failure).
          if release=$(request POST "$api/releases" \
              -H "Content-Type: application/json" \
              --data "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}"); then
            :
          else
            release=$(request GET "$api/releases/tags/$TAG") || exit 1
          fi
          release_id=$(echo "$release" | jq -r '.id')
          echo "Release ID: $release_id"

          for f in dist/*; do
            name=$(basename "$f")
            request POST "$api/releases/$release_id/assets?name=$name" \
              -F "attachment=@$f" > /dev/null || exit 1
            echo "Uploaded $name"
          done
